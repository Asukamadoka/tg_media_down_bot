# Tooling configuration only. The project is run as `python -m tgmd` from a
# plain source checkout (see Dockerfile); it is not packaged or installed.

[tool.ruff]
# The code was written to 100 columns: at 88 it reports 115 lines across the
# whole tree, at 100 it reports two. Width is measured in display columns, so
# a CJK character counts as two.
line-length = 100
# The dev venv is 3.11 and the image is 3.12. Target the lower one, so no
# suggested rewrite produces syntax the dev venv cannot run.
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Listed explicitly rather than inherited. Ruff's default set has grown over
# releases (0.16 turns on BLE, SIM, UP and more by default), and a CI gate
# whose rules move when the linter is upgraded fails for reasons nobody
# changed. CI pins the ruff version too; see .github/workflows/ci.yml.
select = [
    "E",    # pycodestyle errors, including E501 line length
    "W",    # pycodestyle warnings
    "F",    # pyflakes: undefined names, unused imports, real bugs
    "I",    # import order
    "B",    # bugbear: likely bugs
    "UP",   # syntax that has a newer spelling
    "SIM",  # simplifications
    "RUF",  # ruff's own rules, including RUF006 dropped task references
    "SLF",  # private member access, so each deliberate one is marked
    "BLE",  # blind `except Exception`: each one must say why it is safe
]

[tool.ruff.lint.per-file-ignores]
# The Chinese message catalogue is full-width punctuation on purpose: 「，」
# and 「：」 are correct Chinese, not look-alikes of ASCII. RUF001 stays on
# everywhere else, where a stray full-width character would be a real bug,
# for example inside a command name.
"tgmd/i18n.py" = ["RUF001"]
"pikpak_wms/i18n.py" = ["RUF001"]
# Matches Chinese punctuation and numerals on purpose.
"pikpak_wms/nl/rules_parser.py" = ["RUF001", "RUF002"]
"pikpak_wms/rules/names.py" = ["RUF001"]
# Asserts on Chinese output, full-width punctuation included.
"tests/test_wms_m6.py" = ["RUF001"]
"tests/test_wms_m6_bot.py" = ["RUF001"]
"tests/test_i18n_batch2.py" = ["RUF001"]
"tests/test_wms_m7.py" = ["RUF001"]
"tests/test_wms_m7_bot.py" = ["RUF001"]
"tests/test_wms_m7_fixture.py" = ["RUF001"]
# typer declares options as argument defaults; that is its API, not a bug.
"pikpak_wms/cli/*" = ["B008"]
# A diagnostic tool's job is to turn any failure into a "failed" line rather
# than crash, so every check there catches broadly by design. See AUDIT.md C2.
"tgmd/verify.py" = ["BLE001"]
# Fakes stand in for whatever a real client might raise.
"tests/*" = ["BLE001"]

# pytest is configured in pytest.ini. There is deliberately no
# [tool.pytest.ini_options] table here, so there is one source of truth.
