# 规则集。复制为 config/rules.yaml 后修改（或用 WMS_RULES 指定路径）。
# 铁律 3：业务逻辑写在这里，不写在 Python 里。
#
# 求值顺序：规则按文件顺序；一个文件只归第一条命中它的规则。
#          规则命中了某个目录，目录里的东西就不再单独匹配（跟着目录走）。
# 阶段 stage：organize（wms organize、定时 organize）| cleanup（wms cleanup、定时 cleanup）
#
# 匹配器（全部满足才算命中）：
#   kind: file|folder         name_regex: 正则（命名组可在模板里用）
#   path_glob: '/Inbox/**/*.mkv'（* 不跨目录，** 跨目录；不以 / 开头则任意深度）
#   mime: 'video/*'           extensions: [mkv, mp4]
#   category: video|image|audio|document|archive|subtitle
#   min_size / max_size: 100MB、1.5GB（按 1024 进位）
#   older_than / newer_than: 30d、12h、2w，或日期 2026-09-01（按 schedule.timezone）
#   time_field: created（默认，文件进网盘的时间）| modified
#   empty: true（空目录 / 0 字节文件）
# 动作原语：rename / move / copy / trash / star / share / create_folder / outbound
#   没有永久删除：永久删除只能 wms cleanup --forever，且要配置开关（铁律 2）。
# 模板字段：正则命名组，以及 name stem ext parent path size kind category created modified
# 模板过滤器：title / upper / lower / strip / spaces / pad2 / date:%Y-%m
version: 1

rules:
  # ---------- 上架 ----------
  - name: 剧集入库上架
    enabled: true
    scope: /Inbox
    match:
      kind: file
      name_regex: '(?P<show>.+?)[. ]S(?P<s>\d{2})E(?P<e>\d{2})'
      min_size: 100MB
    actions:
      - rename:
          template: '{show|title}.S{s}E{e}.{ext}'
      - move:
          to: '/Media/剧集/{show|spaces|title}/S{s}'
          create_missing: true

  - name: 电影入库上架
    enabled: true
    scope: /Inbox
    match:
      kind: file
      name_regex: '(?P<title>.+?)[. \(](?P<year>(19|20)\d{2})[. \)]'
      min_size: 500MB
    actions:
      - rename:
          template: '{title|spaces|title} ({year}).{ext}'
      - move:
          to: '/Media/电影/{title|spaces|title} ({year})'
          create_missing: true

  # ---------- 整理 ----------
  - name: 清理广告文件
    enabled: true
    scope: /Inbox
    match:
      kind: file
      name_regex: '(?i)(最新地址|广告|种子搜|www\..*\.(com|net|xyz))'
      max_size: 5MB
    actions:
      - trash: {}

  # ---------- 分类（M6 预置模板：按类型归类）----------
  # 上架规则没认出来的，按类型放进 /Media 下对应目录。
  - name: 按类型分类-视频
    enabled: true
    scope: /Inbox
    match: {kind: file, category: video}
    actions:
      - move: {to: /Media/视频}
  - name: 按类型分类-图片
    enabled: true
    scope: /Inbox
    match: {kind: file, category: image}
    actions:
      - move: {to: /Media/图片}
  - name: 按类型分类-音频
    enabled: true
    scope: /Inbox
    match: {kind: file, category: audio}
    actions:
      - move: {to: /Media/音频}
  - name: 按类型分类-文档
    enabled: true
    scope: /Inbox
    match: {kind: file, category: document}
    actions:
      - move: {to: /Media/文档}
  - name: 按类型分类-压缩包
    enabled: true
    scope: /Inbox
    match: {kind: file, category: archive}
    actions:
      - move: {to: /Media/压缩包}

  # ---------- 归档（M6 预置模板：按月归档）----------
  # 进网盘超过 90 天的文件，按进网盘的月份移入 /Archive/2026-09 这样的目录。
  - name: 按月归档
    enabled: false
    scope: /Media/视频
    match:
      kind: file
      older_than: 90d
    actions:
      - move:
          to: '/Archive/{created|date:%Y-%m}'

  # ---------- 星标 / 分享（示例，默认关闭）----------
  # 分享不能撤销（PikPak 没有取消分享的接口），所以只对新文件用。
  - name: 新电影加星标
    enabled: false
    scope: /Media/电影
    match:
      kind: file
      newer_than: 1d
    actions:
      - star: {}

  # ---------- 清退 ----------
  - name: 清退临时区
    enabled: true
    stage: cleanup
    scope: /Temp
    match:
      older_than: 30d
    actions:
      - trash: {}

  - name: 清退空目录
    enabled: false
    stage: cleanup
    scope: /Media
    match:
      kind: folder
      empty: true
      older_than: 7d
    actions:
      - trash: {}

# ================= 整理整棵网盘（docs/wms/M7 §2–§4）=================
# organize-tree / organize-inbox 的阈值、词表、别名都在这里，不在代码里（铁律 3）。
# 这一段整段可以省略，省略时就是下面这些默认值。
tidy:
  skip: []                    # 不整理的一级目录（白名单里的本来就跳过）
  loose:                      # 一级目录里直接放着的文件（§2）
    min_group: 2              # 至少几个文件才成组
    min_prefix: 4             # 名字归一化后共同前缀至少几个字符
    misc: 杂                  # 没归进组的视频（放在各自的一级目录里）
    other: /其他              # 既不是视频也不是图片的：全盘一个（M7.1 A2）；
                              # 写成不带 / 的名字（如「其他」）就是每个一级目录各一个
    images_to: /写真/杂       # 图片统一放这里，重名时加 _<短哈希>
    noise: []                 # 额外要从名字里去掉的正则
  slim:                       # 二级目录里的精简（§3.1），都是进回收站
    flatten: true             # 压平「只有一个子目录、没有文件」的单链
    empty_folders: true
    junk_extensions: [url, html, txt, lnk, apk]   # 不论大小
    junk_words: [最新地址, 防屏蔽, 更多资源]       # 名字带这些词、且小于下面的大小
    junk_words_max_size: 1MiB
  big:                        # 大目录和大文件（§3.2，M7.1 A1）
    # 二级目录是整体，不拆散：总大小 ≥ folder，或里面任意一个文件 ≥ file，
    # 就整个移到 <to>/<一级目录>/<二级目录>/。一级目录里散落的 ≥ file 的文件
    # 移到 <to>/<一级目录>/。
    folder: 50GiB
    file: 4GiB
    to: /大文件
  inbox:                      # 入口目录上架（§4）
    folders: [/Telegram, /Pack From Shared]
    aliases:                  # 一级目录名 → 也算指向它的词
      写真: [cos, cosplay]
    min_name: 2               # 太短的一级目录名单独不算匹配
  ads:                        # 广告疑似（M7.1 A4.2）：单列一份计划，逐份确认，从不自动执行
    enabled: true
    # 两条都满足才算：是图片 / 压缩包 / 可执行文件，或小于 video_max 的视频；
    # 并且名字里有像域名的片段（下面这些后缀），或者下面的词。
    video_max: 30MiB
    suffixes: [com, net, org, vip, cc, xyz, top, me, tv, club, info, io, co, cn]
    words: [二维码, QR, 发布器, 最新地址, 防屏蔽, 永久地址, 精彩直播, 扫码, 加群, 福利群]
    executables: [exe, apk, bat, cmd, msi, dmg, scr, vbs, jar]
  report:                     # 每周大文件报告（§5），只报告不删除
    files: 20
    folders: 10
    stale_days: 90
    stale: 10

